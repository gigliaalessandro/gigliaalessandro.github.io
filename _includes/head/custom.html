{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon: I Ching hexagram 61 -->
<!-- Tab icon: the SVG is listed last so browsers prefer it; it turns white in dark mode.
     The .ico is the fallback for browsers without SVG favicon support.
     The 192/512 PNGs (white background) are only for home screens, via the manifest. -->
<link rel="icon" href="{{ base_path }}/images/favicon.ico" sizes="32x32"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
